name: Test Suite

on:
  push:
    branches: [ main, nightly ]
  pull_request:
    branches: [ main, nightly ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: pip install "poetry==2.1.4"

    - name: Verify lockfile policy
      run: poetry lock --no-update --check

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

    - name: Install dependencies
      run: poetry install --with dev,api,wecom,weixin,msteams,matrix,discord,langsmith,pdf,olostep

    - name: Lint with ruff
      run: poetry run ruff check nanobot --select F401,F841

    - name: Run tests
      run: poetry run pytest tests/
